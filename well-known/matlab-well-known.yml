specification: API Evangelist Well-Known Probe
specificationVersion: '0.1'
provider: MATLAB
providerId: matlab
generated: '2026-09-14'
method: probed
source: live HTTPS probes of every host in apis.yml (registrable domain + www, every apis[].baseURL host, the docs/console host)
note: >-
  www.mathworks.com sits behind an Akamai edge that answers a default crawler User-Agent with
  HTTP 403 "Access Denied" on every path, including /robots.txt. Every probe below was re-run with a
  full browser header set (Chrome UA + sec-ch-ua + Sec-Fetch-*), which the edge accepts. Under that
  header set the host returns a real 200 for /.well-known/security.txt and /llms.txt, and a 403 for
  paths it does not serve — so on this host 403 is the "absent" answer, not a block on our run.
  A 403 recorded here is NOT evidence the provider serves the document.
hosts:
  - host: www.mathworks.com
    documents:
      - path: /.well-known/security.txt
        status: 200
        file: well-known/matlab-security.txt
        content_type: text/plain
        note: Real RFC 9116 document. Contact product-security@mathworks.com, Policy points at the MathWorks vulnerability disclosure policy, Expires 2026-12-31.
