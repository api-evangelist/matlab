metering:
  unit: message
  definition: >-
    A write of up to 8 fields of data to a ThingSpeak channel. REST writes, MQTT writes, MATLAB
    Analysis outputs and React/TimeControl triggers all count as messages; an image write costs 100.
  overage_behaviour: HTTP 402 error_payment_required once the annual allowance is spent.
  source: https://thingspeak.mathworks.com/pages/license_faq
