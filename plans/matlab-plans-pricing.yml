note: >-
  Replaces the 2026-05-04 generated scaffold, whose "matlab-free" tier with 1,000 requests/month and
  10 requests/minute was invented and was never published by MathWorks. What MathWorks actually sells
  is PRODUCT licences, not API plans — the APIs come with the product — plus a separately licensed
  ThingSpeak service metered in messages. Both are recorded below. Where a price is not published,
  price is null with a note rather than a guess.
currency: USD
billing_model: annual product licence (MATLAB) + annual metered service licence (ThingSpeak)
