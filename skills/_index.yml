source: >-
  https://github.com/matlab/matlab-agentic-toolkit,
  https://github.com/matlab/simulink-agentic-toolkit and
  https://github.com/matlab/agent-skills-playground — MathWorks' own GitHub organization (github.com/matlab),
  enumerated through the GitHub REST tree API on 2026-09-14.
note: >-
  These are NOT skills API Evangelist wrote. MathWorks publishes 212 first-party Agent Skills of its own,
  in Anthropic SKILL.md format with YAML frontmatter (name, description, license, metadata.author: MathWorks,
  metadata.version), shipped as Claude Code plugin marketplaces (.claude-plugin/marketplace.json). The
  matlab-agentic-toolkit declares a hard dependency on github.com/matlab/matlab-mcp-server, and individual
  skills name that server's tools directly — matlab-review-code's own description reads "Uses
  check_matlab_code and matlab_coding_guidelines". The skill layer and the MCP layer are one product here,
  which is rare: most providers in this catalog ship one or the other.
  No skill in this repository was authored by API Evangelist; the eight files under
  skills/mathworks-matlab-core/ are saved verbatim from the provider.
license: https://www.mathworks.com/content/dam/mathworks/license/pmrl/license.md
format: Anthropic Agent Skill (SKILL.md + YAML frontmatter, optional references/ and scripts/)
distribution: Claude Code plugin marketplace (.claude-plugin/marketplace.json), one plugin per skill group
